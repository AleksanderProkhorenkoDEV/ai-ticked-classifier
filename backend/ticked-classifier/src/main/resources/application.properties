spring.application.name=ticked-classifier


server.port=${PORT:8080}

# DATABASE_URL only exists for Render: on Aiven there is no localhost to connect to.
# The default keeps the local docker-compose workflow untouched.
spring.datasource.url=jdbc:mysql://${DB_URL}/${DB_SCHEMA}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ticket-classifier.aprokhorenko.dev}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.base-url=${MISTRAL_URL}
spring.ai.mistralai.chat.model=ministral-3b-2512